asyncapi: 3.0.0
info:
  title: Kafka task
  version: 0.0.1
  description: Данные задач после первичного перекладывания

channels:
  task:
    address: task
    messages:
      default:
        contentType: application/json
        payload:
          type: object
          properties:
            request_id:
              type: string
              description: ID запроса
            user_id:
              type: integer
              format: int64
              description: ID пользователя
            chance:
              type: integer
              format: int64
              description: Шанс на провал
              minimum: 0
              maximum: 100
            duration:
              type: integer
              format: int64
              description: Желаемая продолжительность обработки в секундах
              minimum: 1
              maximum: 50
operations:
  task:
    action: receive
    channel:
      $ref: "#/channels/task"
