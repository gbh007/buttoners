name: buttoners

include:
  - full-infra.docker-compose.yml
  - observability.docker-compose.yml

services:
  gate:
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
      args:
        BINARY_PATH: ./bin/build/gate
    restart: none
    ports:
      - 14281:14281
    environment:
      SELF_HOST: 0.0.0.0
      SELF_PORT: 14281
      AUTH_SERVICE_ADDR: http://auth:8080
      AUTH_SERVICE_TOKEN: auth-service-secret
      NOTIFICATION_SERVICE_ADDR: http://notification:8080
      NOTIFICATION_SERVICE_TOKEN: notification-service-secret
      LOG_SERVICE_ADDR: http://log:8080
      LOG_SERVICE_TOKEN: log-service-secret
    labels:
      - prometheus.io/scrape=true
      - prometheus.io/port=8082
      - prometheus.io/path=/metrics
    depends_on:
      - auth
      - kafka
      - notification
      - log
      - redis
      - victoriatraces

  legacy:
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
      args:
        BINARY_PATH: ./bin/build/legacy
    restart: none
    ports:
      - 8081:8080
    environment:
      KAFKA_GROUP_ID: legacy
      SELF_ADDR: :8080
      SELF_DEBUG: false
      DB_TYPE: "postgres"
      DB_DNS: "postgres://legacy_user:legacy_pwd@postgres:5432/legacy_db?sslmode=disable"
      AUTH_SERVICE_ADDR: http://auth:8080
      AUTH_SERVICE_TOKEN: auth-service-secret
    labels:
      - prometheus.io/scrape=true
      - prometheus.io/port=8082
      - prometheus.io/path=/metrics
    depends_on:
      - auth
      - postgres
      - victoriatraces

  auth:
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
      args:
        BINARY_PATH: ./bin/build/auth
    restart: none
    environment:
      SELF_ADDR: :8080
      SELF_TOKEN: auth-service-secret
      DB_USER: auth_user
      DB_PASS: auth_pwd
      DB_ADDR: mariadb:3306
      DB_NAME: auth_db
    labels:
      - prometheus.io/scrape=true
      - prometheus.io/port=8082
      - prometheus.io/path=/metrics
    depends_on:
      - mariadb
      - redis
      - victoriatraces

  handler:
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
      args:
        BINARY_PATH: ./bin/build/handler
    restart: none
    environment:
      KAFKA_GROUP_ID: handler
      RABBIT_MQ_USER: task
      RABBIT_MQ_PASS: task_pwd
    deploy:
      mode: replicated
      replicas: 3
    labels:
      - prometheus.io/scrape=true
      - prometheus.io/port=8082
      - prometheus.io/path=/metrics
    depends_on:
      - kafka
      - rabbitmq
      - victoriatraces

  log:
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
      args:
        BINARY_PATH: ./bin/build/log
    restart: none
    environment:
      KAFKA_GROUP_ID: log
      DB_USER: log_user
      DB_PASS: log_pwd
      DB_ADDR: clickhouse:8123
      DB_NAME: log_db
      SELF_ADDR: :8080
      SELF_TOKEN: log-service-secret
    deploy:
      mode: replicated
      replicas: 3
    labels:
      - prometheus.io/scrape=true
      - prometheus.io/port=8082
      - prometheus.io/path=/metrics
    depends_on:
      - kafka
      - clickhouse
      - victoriatraces

  worker:
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
      args:
        BINARY_PATH: ./bin/build/worker
    restart: none
    environment:
      RABBIT_MQ_USER: task
      RABBIT_MQ_PASS: task_pwd
      DB_USER: task_user
      DB_PASS: task_pwd
      DB_ADDR: clickhouse:8123
      DB_NAME: task_db
      NOTIFICATION_SERVICE_ADDR: http://notification:8080
      NOTIFICATION_SERVICE_TOKEN: notification-service-secret
    deploy:
      mode: replicated
      replicas: 2
    labels:
      - prometheus.io/scrape=true
      - prometheus.io/port=8082
      - prometheus.io/path=/metrics
    depends_on:
      - rabbitmq
      - notification
      - clickhouse
      - victoriatraces

  notification:
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
      args:
        BINARY_PATH: ./bin/build/notification
    restart: none
    environment:
      SELF_ADDR: :8080
      SELF_TOKEN: notification-service-secret
      DB_USER: notification_user
      DB_PASS: notification_pwd
      DB_ADDR: mariadb:3306
      DB_NAME: notification_db
    deploy:
      mode: replicated
      replicas: 2
    labels:
      - prometheus.io/scrape=true
      - prometheus.io/port=8082
      - prometheus.io/path=/metrics
    depends_on:
      - mariadb
      - victoriatraces

  nginx:
    image: nginx:1.27
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../services/legacy/static:/services/legacy/static:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.legacy.rule=Host(`legacy.localhost`)
      - traefik.http.services.legacy.loadbalancer.server.url=http://nginx:80
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 2
    depends_on:
      - legacy

  traefik:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedHeaders.trustedIPs=172.0.0.0/8,192.168.0.0/16
      - --providers.docker.exposedbydefault=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 80:80
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.services.traefik.loadbalancer.server.url=http://traefik:8080
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
