services:
  mariadb:
    image: mariadb:11
    restart: none
    command: "--init-file /init.sql"
    environment:
      MARIADB_ROOT_PASSWORD: 12345
    volumes:
      - mariadb:/var/lib/mysql
      - ./maria-db-dev-init.sql:/init.sql
    ports:
      - 13306:3306

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: none
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-secrets:/etc/zookeeper/secrets
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:latest
    restart: none
    depends_on:
      - zookeeper
    volumes:
      - kafka-secrets:/etc/kafka/secrets
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  init-kafka:
    image: confluentinc/cp-kafka:latest
    restart: none
    init: true
    depends_on:
      - kafka
    command: ["/bin/sh", "-c", "/kafka.sh"]
    volumes:
      - ./inits/kafka.sh:/kafka.sh

  clickhouse:
    image: clickhouse/clickhouse-server:22.2
    restart: none
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: 123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: default
      CLICKHOUSE_UID: 0
      CLICKHOUSE_GID: 0
    volumes:
      - clickhouse-log:/var/log/clickhouse-server
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-db-dev-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 18123:8123

  rabbitmq:
    image: rabbitmq:3.12
    restart: none
    environment:
      RABBITMQ_DEFAULT_USER: task
      RABBITMQ_DEFAULT_PASS: task_pwd
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7.2
    restart: none
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-db-dev-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 15432:5432
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 2

volumes:
  mariadb: {}
  kafka-secrets: {}
  kafka-data: {}
  zookeeper-secrets: {}
  zookeeper-data: {}
  zookeeper-log: {}
  clickhouse-data: {}
  clickhouse-log: {}
  rabbitmq-data: {}
  redis-data: {}
  postgres: {}
